name: Run Download and Upload
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: YouTube Video URL
        required: true
        default: "https://youtu.be/ooWuq064T28"

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with GitHub
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" > gh_token.txt
          gh auth login --with-token < gh_token.txt

      - name: Run script in codespace
        run: |
          gh codespace ssh -c supreme-acorn-wvgpgj5jrr792vqg6 -- \
            "export VIDEO_URL='${{ github.event.inputs.video_url }}' && \
             export YOUTUBE_COOKIES_FILE='/workspaces/codespaces-api-test/cookies.txt' && \
             export DRIVE_REFRESH_TOKEN='${{ secrets.DRIVE_REFRESH_TOKEN }}' && \
             export DRIVE_CLIENT_ID='${{ secrets.DRIVE_CLIENT_ID }}' && \
             export DRIVE_CLIENT_SECRET='${{ secrets.DRIVE_CLIENT_SECRET }}' && \
             bash /workspaces/codespaces-api-test/download_and_upload.sh"
