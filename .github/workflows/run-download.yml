name: Run Download and Upload
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: YouTube Video URL
        required: true
        default: "https://youtu.be/ooWuq064T28"

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with GitHub
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" > gh_token.txt
          gh auth login --with-token < gh_token.txt

      - name: Start codespace if needed
        run: |
          gh api repos/M20291/codespaces-api-test/codespaces/probable-couscous-p7p4pqwqjp6qf9r4q/start --method POST || echo "Codespace already running"

      - name: Run script in codespace
        run: |
          gh api repos/M20291/codespaces-api-test/codespaces/probable-couscous-p7p4pqwqjp6qf9r4q/machines/default/start --method POST || echo "Machine already running"
          
          gh api repos/M20291/codespaces-api-test/codespaces/probable-couscous-p7p4pqwqjp6qf9r4q/commands \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f workingDirectory="/workspaces/codespaces-api-test" \
            -f environment.VIDEO_URL="${{ github.event.inputs.video_url }}" \
            -f environment.COOKIES="${{ secrets.YOUTUBE_COOKIES }}" \
            -f environment.DRIVE_REFRESH_TOKEN="${{ secrets.DRIVE_REFRESH_TOKEN }}" \
            -f environment.DRIVE_CLIENT_ID="${{ secrets.DRIVE_CLIENT_ID }}" \
            -f environment.DRIVE_CLIENT_SECRET="${{ secrets.DRIVE_CLIENT_SECRET }}" \
            -f command="bash download_and_upload.sh"
