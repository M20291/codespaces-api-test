name: Run Download and Upload
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: YouTube Video URL
        required: true
        default: "https://youtu.be/ooWuq064T28"

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save cookies to file and encode
        env:
          YOUTUBE_COOKIES_CONTENT: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "Checking if YOUTUBE_COOKIES secret exists..."
          if [ -z "$YOUTUBE_COOKIES_CONTENT" ]; then
            echo "❌ YOUTUBE_COOKIES secret is empty or not set!"
            exit 1
          fi
          echo "✅ YOUTUBE_COOKIES secret found, length: ${#YOUTUBE_COOKIES_CONTENT}"
          echo "$YOUTUBE_COOKIES_CONTENT" > /tmp/cookies.txt
          COOKIES_BASE64=$(base64 -w 0 /tmp/cookies.txt)
          echo "COOKIES_BASE64=$COOKIES_BASE64" >> $GITHUB_ENV

      - name: Send command to HTTP server
        run: |
          echo "HTTP_SERVER_URL: ${{ secrets.HTTP_SERVER_URL }}"
          echo "VIDEO_URL: ${{ github.event.inputs.video_url }}"
          echo "COOKIES_BASE64 length: ${#COOKIES_BASE64}"
          
          COMMAND="export VIDEO_URL='${{ github.event.inputs.video_url }}' && export COOKIES_BASE64='$COOKIES_BASE64' && export DRIVE_REFRESH_TOKEN='${{ secrets.DRIVE_REFRESH_TOKEN }}' && export DRIVE_CLIENT_ID='${{ secrets.DRIVE_CLIENT_ID }}' && export DRIVE_CLIENT_SECRET='${{ secrets.DRIVE_CLIENT_SECRET }}' && bash /workspaces/codespaces-api-test/download_and_upload.sh"
          
          echo "Command length: ${#COMMAND}"
          
          RESPONSE=$(curl -X POST "${{ secrets.HTTP_SERVER_URL }}/execute" \
            -H "Content-Type: application/json" \
            -d "{\"command\":\"$COMMAND\"}")
          
          echo "Response: $RESPONSE"
          
          # Check if command was successful
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Command executed successfully"
            echo "$RESPONSE" | jq -r '.stdout'
          else
            echo "❌ Command failed"
            echo "$RESPONSE" | jq -r '.error'
            exit 1
          fi
